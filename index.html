*{box-sizing:border-box}
body{margin:0;background:#0F0E0C;color:#F4EFE4;font-family:'Noto Sans KR',sans-serif}
a{color:#F4EFE4}a:hover{color:#D4AF5A}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 16px}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:36px}
.top{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}

.intro{margin:0;font-size:16px;line-height:1.7;color:#CFC8BA}
.titles{width:100%;display:flex;justify-content:center;flex-wrap:wrap;font-size:13px;color:#A39B8C}
.titles span{padding:0 12px;border-right:1px solid #3A352C}
.titles span:last-child{border-right:0}
.titles a{color:#D4AF5A;text-decoration:underline;text-underline-offset:3px}
nav{width:100%;display:flex;flex-direction:column;gap:10px}
nav a{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 22px;border:1px solid #3A352C;text-decoration:none;font-size:15px;font-weight:500}
nav a.main{border-color:#D4AF5A}
nav a small{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A39B8C}
nav a.main small{color:#D4AF5A}
.motto{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.24em;color:#8A8273}
